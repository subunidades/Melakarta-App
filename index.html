<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melakarta Brightness Spectrum</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f13;
    color: #e0ddd6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
    color: #f0ede6;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
  }
  #controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #controls button {
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a22;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #controls button.active {
    background: #e0ddd6;
    color: #111;
    border-color: #e0ddd6;
  }
  #controls button:hover:not(.active) {
    border-color: #555;
    color: #ccc;
  }
  #legend {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #666;
    margin-bottom: 12px;
  }
  .leg-grad {
    width: 180px;
    height: 12px;
    border-radius: 4px;
  }
  #canvas-wrap {
    width: 100%;
    max-width: 860px;
  }
  canvas {
    width: 100%;
    display: block;
    border-radius: 10px;
    background: #15151c;
    cursor: crosshair;
  }
  #tooltip {
    position: fixed;
    background: #1e1e28;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #e0ddd6;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 240px;
    line-height: 1.6;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #tooltip strong { color: #f0ede6; font-weight: 500; }
  .hint { font-size: 12px; color: #555; margin-top: 12px; text-align: center; }
</style>
</head>
<body>

<h1>Melakarta Brightness Spectrum</h1>
<p class="subtitle">72 melas ordered from darkest (most komal) to brightest (most tivra)</p>

<div id="controls">
  <button class="active" onclick="setView('spectrum')">Brightness spectrum</button>
  <button onclick="setView('chakra')">By chakra</button>
</div>

<div id="legend">
  <span>Darkest</span>
  <canvas class="leg-grad" id="legCanvas" width="180" height="12"></canvas>
  <span>Brightest</span>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>
<p class="hint">Hover a bar for details · Click a bar to highlight</p>

<div id="tooltip"></div>

<script>
const chakraNames = [
  "Indu","Netra","Agni","Veda","Bana","Rutu",
  "Rishi","Vasu","Brahma","Disi","Rudra","Aditya"
];

// [number, name, R(0-2), G(0-2), M(0-1), D(0-2), N(0-2)]
const melakartas = [
  [1,"Kanakangi",0,0,0,0,0],[2,"Ratnangi",0,0,0,0,1],[3,"Ganamurti",0,0,0,0,2],
  [4,"Vanaspati",0,0,0,1,1],[5,"Manavati",0,0,0,1,2],[6,"Tanarupi",0,0,0,2,2],
  [7,"Senavati",0,1,0,0,0],[8,"Hanumatodi",0,1,0,0,1],[9,"Dhenuka",0,1,0,0,2],
  [10,"Natakapriya",0,1,0,1,1],[11,"Kokilapriya",0,1,0,1,2],[12,"Rupavati",0,1,0,2,2],
  [13,"Gayakapriya",0,2,0,0,0],[14,"Vakulabharanam",0,2,0,0,1],[15,"Mayamalavagowla",0,2,0,0,2],
  [16,"Chakravakam",0,2,0,1,1],[17,"Suryakantam",0,2,0,1,2],[18,"Hatakambari",0,2,0,2,2],
  [19,"Jhankaradhvani",1,1,0,0,0],[20,"Natabhairavi",1,1,0,0,1],[21,"Keeravani",1,1,0,0,2],
  [22,"Kharaharapriya",1,1,0,1,1],[23,"Gourimanohari",1,1,0,1,2],[24,"Varunapriya",1,1,0,2,2],
  [25,"Mararanjani",1,2,0,0,0],[26,"Charukesi",1,2,0,0,1],[27,"Sarasangi",1,2,0,0,2],
  [28,"Harikambhoji",1,2,0,1,1],[29,"Dheerashankarabharanam",1,2,0,1,2],[30,"Naganandini",1,2,0,2,2],
  [31,"Yagapriya",2,2,0,0,0],[32,"Ragavardhini",2,2,0,0,1],[33,"Gangeyabhushani",2,2,0,0,2],
  [34,"Vagadheesvari",2,2,0,1,1],[35,"Shulini",2,2,0,1,2],[36,"Chalanata",2,2,0,2,2],
  [37,"Salagam",0,0,1,0,0],[38,"Jalarnavam",0,0,1,0,1],[39,"Jhalavarali",0,0,1,0,2],
  [40,"Navanitam",0,0,1,1,1],[41,"Pavani",0,0,1,1,2],[42,"Raghupriya",0,0,1,2,2],
  [43,"Gavambodhi",0,1,1,0,0],[44,"Bhavapriya",0,1,1,0,1],[45,"Shubhapantuvarali",0,1,1,0,2],
  [46,"Shadvidhamargini",0,1,1,1,1],[47,"Suvarnangi",0,1,1,1,2],[48,"Divyamani",0,1,1,2,2],
  [49,"Dhavalambari",0,2,1,0,0],[50,"Namanarayani",0,2,1,0,1],[51,"Kamavardhini",0,2,1,0,2],
  [52,"Ramapriya",0,2,1,1,1],[53,"Gamanashrama",0,2,1,1,2],[54,"Vishvambhari",0,2,1,2,2],
  [55,"Shamalangi",1,1,1,0,0],[56,"Shanmukhapriya",1,1,1,0,1],[57,"Simhendramadhyamam",1,1,1,0,2],
  [58,"Hemavati",1,1,1,1,1],[59,"Dharmavati",1,1,1,1,2],[60,"Neetimati",1,1,1,2,2],
  [61,"Kantamani",1,2,1,0,0],[62,"Rishabhapriya",1,2,1,0,1],[63,"Latangi",1,2,1,0,2],
  [64,"Vachaspati",1,2,1,1,1],[65,"Mechakalyani",1,2,1,1,2],[66,"Chitrambari",1,2,1,2,2],
  [67,"Sucharitra",2,2,1,0,0],[68,"Jyotisvarupini",2,2,1,0,1],[69,"Dhatuvardhini",2,2,1,0,2],
  [70,"Nasikabhushani",2,2,1,1,1],[71,"Kosalam",2,2,1,1,2],[72,"Rasikapriya",2,2,1,2,2],
];

const varNames = {
  R:["R1 (komal)","R2 (shuddha)","R3 (tivra)"],
  G:["G1 (komal)","G2 (shuddha)","G3 (tivra)"],
  M:["M1 (shuddha)","M2 (tivra)"],
  D:["D1 (komal)","D2 (shuddha)","D3 (tivra)"],
  N:["N1 (komal)","N2 (shuddha)","N3 (tivra)"]
};

function brightness(m) { return m[2]+m[3]+m[4]*1.5+m[5]+m[6]; }

const melas = melakartas.map(m=>({
  num:m[0], name:m[1], chakra:Math.ceil(m[0]/6),
  R:m[2], G:m[3], M:m[4], D:m[5], N:m[6],
  brightness:brightness(m)
}));

const minB = Math.min(...melas.map(m=>m.brightness));
const maxB = Math.max(...melas.map(m=>m.brightness));

function bColor(b, alpha) {
  const t = (b-minB)/(maxB-minB);
  const r = Math.round(20+t*220);
  const g = Math.round(10+t*150);
  const bl = Math.round(180-t*130);
  if(alpha !== undefined) return `rgba(${r},${g},${bl},${alpha})`;
  return `rgb(${r},${g},${bl})`;
}

// Legend
const lc = document.getElementById('legCanvas');
const lx = lc.getContext('2d');
const lg = lx.createLinearGradient(0,0,180,0);
for(let i=0;i<=10;i++) lg.addColorStop(i/10, bColor(minB+(maxB-minB)*i/10));
lx.fillStyle=lg; lx.fillRect(0,0,180,12);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W=860, H=340;
canvas.width=W; canvas.height=H;

const tip = document.getElementById('tooltip');
let viewMode='spectrum', barRects=[], highlighted=null;

function draw() {
  ctx.clearRect(0,0,W,H);
  barRects=[];

  if(viewMode==='spectrum') {
    const sorted=[...melas].sort((a,b)=>a.brightness-b.brightness);
    const pad=32, bw=(W-pad*2)/72, bh=260, baseY=H-44;

    // Background grid lines
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=1;
    for(let i=0;i<=4;i++) {
      const y=baseY-40-(i/4)*(bh-40);
      ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke();
    }

    sorted.forEach((m,i)=>{
      const x=pad+i*bw;
      const h=40+((m.brightness-minB)/(maxB-minB))*(bh-40);
      const y=baseY-h;
      const isHl=highlighted&&highlighted.num===m.num;
      ctx.fillStyle=isHl?'#fff':bColor(m.brightness);
      ctx.globalAlpha=isHl?1:0.88;
      ctx.fillRect(x,y,Math.max(bw-1,1),h);
      ctx.globalAlpha=1;
      barRects.push({x,y,w:Math.max(bw-1,1),h,mela:m});
    });

    // Axis
    ctx.fillStyle='rgba(150,150,150,0.5)';
    ctx.font='11px sans-serif';
    ctx.textAlign='left'; ctx.fillText('← more komal / darker',pad,H-16);
    ctx.textAlign='right'; ctx.fillText('more tivra / brighter →',W-pad,H-16);
    ctx.textAlign='center';
    ctx.fillStyle='rgba(200,200,200,0.35)';
    ctx.font='12px sans-serif';
    ctx.fillText('72 melakartas sorted by tonal brightness',W/2,22);

    // M1/M2 divider
    const sorted_idx=sorted.findIndex(m=>m.M===1);
    if(sorted_idx>0) {
      const dx=pad+sorted_idx*bw;
      ctx.strokeStyle='rgba(255,255,255,0.15)';
      ctx.setLineDash([4,4]);
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(dx,20); ctx.lineTo(dx,baseY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(180,180,180,0.4)';
      ctx.font='10px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('M1 | M2',dx,36);
    }

  } else {
    // Chakra view: 4 cols x 3 rows
    const cols=4, cw=(W-40)/cols, ch=(H-40)/3;
    ctx.font='500 11px sans-serif';

    for(let c=0;c<12;c++) {
      const col=c%cols, row=Math.floor(c/cols);
      const cx=20+col*cw, cy=20+row*ch;
      const chakraMelas=melas.filter(m=>m.chakra===c+1).sort((a,b)=>a.brightness-b.brightness);
      const bw=(cw-16)/6, bh=ch-32;

      ctx.fillStyle='rgba(255,255,255,0.03)';
      ctx.beginPath();
      ctx.roundRect(cx,cy,cw-8,ch-8,6);
      ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.06)';
      ctx.lineWidth=1;
      ctx.stroke();

      ctx.fillStyle='rgba(180,180,180,0.5)';
      ctx.textAlign='left';
      ctx.fillText(`${c+1}. ${chakraNames[c]}`,cx+6,cy+13);

      chakraMelas.forEach((m,i)=>{
        const x=cx+8+i*bw;
        const h=12+((m.brightness-minB)/(maxB-minB))*(bh-12);
        const y=cy+ch-14-h;
        const isHl=highlighted&&highlighted.num===m.num;
        ctx.fillStyle=isHl?'#fff':bColor(m.brightness);
        ctx.globalAlpha=isHl?1:0.85;
        ctx.fillRect(x,y,Math.max(bw-1,1),h);
        ctx.globalAlpha=1;
        barRects.push({x,y,w:Math.max(bw-1,1),h,mela:m});
      });
    }

    ctx.fillStyle='rgba(180,180,180,0.4)';
    ctx.textAlign='center';
    ctx.font='11px sans-serif';
    ctx.fillText('12 chakras — 6 melas each, sorted by brightness within each chakra',W/2,14);
  }
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width, sy = H / rect.height;
  const mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
  
  let found = null;
  for (const b of barRects) {
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      found = b;
      break;
    }
  }

  if (found) {
    const m = found.mela;
    tip.style.display = 'block';
    tip.innerHTML = `<strong>#${m.num} ${m.name}</strong><br>
Chakra ${m.chakra} (${chakraNames[m.chakra-1]})<br>
${varNames.R[m.R]} &nbsp;·&nbsp; ${varNames.G[m.G]}<br>
${varNames.M[m.M]} &nbsp;·&nbsp; ${varNames.D[m.D]} &nbsp;·&nbsp; ${varNames.N[m.N]}<br>
<span style="color:${bColor(m.brightness)}">●</span> Brightness score: ${m.brightness.toFixed(1)}`;

    const pad = 12;
    const tipWidth = tip.offsetWidth;
    const tipHeight = tip.offsetHeight;

    let x = e.clientX + 14;
    let y = e.clientY - 8;

    if (x + tipWidth > window.innerWidth - pad) {
      x = e.clientX - tipWidth - 14;
    }

    if (y + tipHeight > window.innerHeight - pad) {
      y = window.innerHeight - tipHeight - pad;
    }

    if (y < pad) {
      y = pad;
    }

    tip.style.left = `${x}px`;
    tip.style.top = `${y}px`;
    canvas.style.cursor = 'pointer';
  } else {
    tip.style.display = 'none';
    canvas.style.cursor = 'crosshair';
  }
});

canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width, sy = H / rect.height;
  const mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
  for (const b of barRects) {
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      highlighted = highlighted && highlighted.num === b.mela.num ? null : b.mela;
      draw();
      break;
    }
  }
});

function setView(v) {
  viewMode = v; highlighted = null;
  document.querySelectorAll('#controls button').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && v === 'spectrum') || (i === 1 && v === 'chakra'));
  });
  draw();
}

draw();
</script>
</body>
</html>
